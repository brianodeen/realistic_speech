version: "1.0"
language: "Colossal Dragon / Mythic Beast Roar"
description: "Epic creature benchmark: Sub-bass chest rumble (52Hz), colossal elongated vocal tract (1.45x scale), violent false-cord ventricular chaos, and soaring guttural roar into fiery exhalation."

speaker:
  name: "Brimstone Wyrm (Ancient Dragon)"
  base_pitch_hz: 52.0
  pitch_range_semitones: 22.0
  vocal_tract_scale: 1.45 # Massive acoustic cavern
  breathiness: 0.18
  vocal_fry: 0.30
  growl_roughness: 0.85
  purr_depth: 0.0
  cursive_flow: 0.88
  acoustic_warmth: 0.70
  fleshiness: 0.85
  default_volume_db: 0.0

utterance:
  # 1. Deep Infrasonic Sub-Bass Warning: "Krrr-gh"
  - label: "Krrgh"
    duration_ms: 900
    prosody:
      phonation: "ventricular_growl"
      pitch_curve:
        - [0.0, 48.0]
        - [0.6, 62.0]
        - [1.0, 55.0]
      volume_envelope:
        - [0.0, -18.0]
        - [0.25, 0.0]
        - [0.8, 1.0]
        - [1.0, -1.0]
    phonemes:
      - symbol: "k"
        type: "consonant"
        duration_ms: 90
      - symbol: "feline_growl"
        type: "creature"
        intensity: 0.95
        subharmonic_depth: 0.90
        duration_ms: 650
      - symbol: "x_velar"
        type: "consonant"
        duration_ms: 160

  # 2. Glottal Compression Occlusion
  - label: "ʔ"
    duration_ms: 50
    prosody:
      phonation: "modal"
    phonemes:
      - symbol: "glottal_stop"
        type: "consonant"
        duration_ms: 50

  # 3. Colossal Explosive Roar: "RRAAAA-OOOORRR"
  - label: "ROAAAR"
    duration_ms: 2200
    prosody:
      phonation: "ventricular_growl"
      pitch_curve:
        - [0.0, 65.0]
        - [0.25, 160.0] # Massive crescendo peak
        - [0.65, 140.0]
        - [1.0, 45.0]
      vibrato_rate_hz: 6.5
      vibrato_depth_semitones: 0.8
      volume_envelope:
        - [0.0, -3.0]
        - [0.2, 3.0] # Peak acoustic explosion
        - [0.75, 1.0]
        - [1.0, -14.0]
    phonemes:
      - symbol: "feline_growl"
        type: "creature"
        intensity: 1.0
        subharmonic_depth: 0.95
        duration_ms: 600
      - symbol: "open_o"
        type: "vowel"
        duration_ms: 700
      - symbol: "a"
        type: "vowel"
        duration_ms: 500
      - symbol: "x_velar"
        type: "consonant"
        duration_ms: 400

  # 4. Final Steaming Exhalation Hiss: "Hssshhh"
  - label: "Hsssh"
    duration_ms: 800
    prosody:
      phonation: "whisper"
      volume_envelope:
        - [0.0, 0.0]
        - [0.3, -2.0]
        - [1.0, -28.0]
    phonemes:
      - symbol: "feline_hiss"
        type: "creature"
        intensity: 0.85
        duration_ms: 500
      - symbol: "sh"
        type: "consonant"
        duration_ms: 300
