version: "1.0"
language: "Tibetan / Tuvan Kargyraa Throat Singing"
description: "Human overtone singing benchmark featuring deep subharmonic ventricular fold vibration (68Hz drone), resonant oral cavity tuning, and overtone harmonics."

speaker:
  name: "Lama Dorje (Deep Monk Resonance)"
  base_pitch_hz: 68.0
  pitch_range_semitones: 6.0
  vocal_tract_scale: 1.15
  breathiness: 0.05
  vocal_fry: 0.35
  growl_roughness: 0.55
  purr_depth: 0.0
  cursive_flow: 0.95
  acoustic_warmth: 0.65
  fleshiness: 0.82
  default_volume_db: 0.0

utterance:
  # 1. Low Guttural Drone Chant: "Oooommm"
  - label: "Oooommm"
    duration_ms: 1200
    prosody:
      chao_tone: "11" # Ultra-deep base drone
      phonation: "ventricular_growl"
      volume_envelope:
        - [0.0, -12.0]
        - [0.2, 0.0]
        - [0.8, 0.5]
        - [1.0, -2.0]
    phonemes:
      - symbol: "o"
        type: "vowel"
        duration_ms: 600
      - symbol: "u"
        type: "vowel"
        duration_ms: 400
      - symbol: "m"
        type: "consonant"
        duration_ms: 200

  # 2. Sweeping Resonant Vowel Harmonic: "Aaaa-eeee"
  - label: "Aaaa-eeee"
    duration_ms: 1600
    prosody:
      chao_tone: "11"
      phonation: "ventricular_growl"
      vibrato_rate_hz: 4.8
      vibrato_depth_semitones: 0.3
      volume_envelope:
        - [0.0, -2.0]
        - [0.15, 1.0]
        - [0.75, 0.5]
        - [1.0, -18.0]
    phonemes:
      - symbol: "a"
        type: "vowel"
        duration_ms: 700
      - symbol: "schwa"
        type: "vowel"
        duration_ms: 300
      - symbol: "i"
        type: "vowel"
        duration_ms: 600
